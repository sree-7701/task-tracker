<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Task Tracker</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5" style="max-width: 600px;">
    <h2 class="mb-4">Task Tracker</h2>

    <div class="input-group mb-3">
    <input id="title" class="form-control" placeholder="New task">
    <button class="btn btn-primary" onclick="addTask()">Add</button>
    </div>

    <ul id="list" class="list-group"></ul>
</div>

<script>
    async function loadTasks() {
    const res = await fetch("/api/tasks");
    const tasks = await res.json();
    const list = document.getElementById("list");
    list.innerHTML = "";
    tasks.forEach(t => {
        const li = document.createElement("li");
        li.className = "list-group-item d-flex justify-content-between align-items-center";
        li.innerHTML = `
        <span style="${t.done ? 'text-decoration: line-through' : ''}">${t.title}</span>
        <span>
            <button class="btn btn-sm btn-success me-1" onclick="toggle(${t.id}, ${t.done})">✓</button>
            <button class="btn btn-sm btn-danger" onclick="removeTask(${t.id})">✕</button>
        </span>`;
        list.appendChild(li);
    });
    }

    async function addTask() {
    const input = document.getElementById("title");
    if (!input.value.trim()) return;
    await fetch("/api/tasks", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({title: input.value})
    });
    input.value = "";
    loadTasks();
    }

    async function toggle(id, done) {
    await fetch("/api/tasks/" + id, {
        method: "PUT",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({done: done ? 0 : 1})
    });
    loadTasks();
    }

    async function removeTask(id) {
    await fetch("/api/tasks/" + id, {method: "DELETE"});
    loadTasks();
    }

    loadTasks();
</script>
</body>
</html>
